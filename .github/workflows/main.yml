name: AnyDesk Official CLI Setup

on:
  workflow_dispatch:

jobs:
  run-anydesk:
    runs-on: windows-latest
    steps:
      - name: 1. Install & Connect Tailscale
        shell: powershell
        run: |
          $botToken = "8741257302:AAEqt3JMWjghmx6JU8uQmuhazOnetwRP690"
          $chatId = "2063422375"
          
          function Send-Telegram {
              param([string]$message)
              try {
                  $encoded = [uri]::EscapeDataString($message)
                  Invoke-WebRequest -Uri "https://api.telegram.org/bot$botToken/sendMessage?chat_id=$chatId&text=$encoded" -UseBasicParsing -TimeoutSec 10 | Out-Null
              } catch {
                  Write-Host "Failed to send Telegram message: $_"
              }
          }
          
          Send-Telegram "🚀 [START] Workflow Started - Run ID: ${{ github.run_id }}"
          
          try {
              Send-Telegram "📥 Step 1: Downloading Tailscale installer..."
              $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.92.3-amd64.msi"
              $installerPath = "$env:TEMP\tailscale.msi"
              Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
              
              Send-Telegram "🔧 Installing Tailscale silently..."
              # تصحيح: تبسيط وسائط التثبيت لتجنب أخطاء التنصيص
              Start-Process msiexec.exe -ArgumentList "/i `"$installerPath`" /quiet /norestart" -Wait
              
              Send-Telegram "🔑 Attempting Tailscale login with auth key..."
              
              # تصحيح: تأمين المتغير السري بين علامتي تنصيص
              $authKey = "${{ secrets.TAILSCALE_AUTHKEY }}"
              $tsOutput = & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey="$authKey" --hostname="gh-runner-${{ github.run_id }}" 2>&1
              
              # Send ALL output to Telegram
              if ($tsOutput) {
                  Send-Telegram "ℹ️ Tailscale UP Output: `n$tsOutput"
              }
              
              # Check if it's asking for login (interactive prompt)
              if ($tsOutput -match "login" -or $tsOutput -match "authenticate" -or $tsOutput -match "https://") {
                  Send-Telegram "⚠️ [WARNING] Tailscale might be waiting for interactive login!`nOutput: $tsOutput"
              }
              
              # Get IP
              Start-Sleep -Seconds 3
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>&1
              
              if ($tsIP -match "^\d+\.\d+\.\d+\.\d+$") {
                  "TAILSCALE_IP=$tsIP" | Out-File -Append $env:GITHUB_ENV
                  Send-Telegram "✅ Tailscale Connected Successfully!`n🌐 IP: $tsIP"
              } else {
                  Send-Telegram "❌ [ERROR] Failed to get Tailscale IP! Output: $tsIP"
                  
                  # Get full status for debugging
                  $tsStatus = & "$env:ProgramFiles\Tailscale\tailscale.exe" status 2>&1
                  Send-Telegram "🔍 Tailscale Status:`n$tsStatus"
                  throw "Tailscale connection failed"
              }
              
          } catch {
              Send-Telegram "❌ [FATAL ERROR] Tailscale step failed:`n$($_.Exception.Message)"
              throw
          }

      - name: 2. Official AnyDesk Installation & Logic
        shell: powershell
        run: |
          $botToken = "8741257302:AAEqt3JMWjghmx6JU8uQmuhazOnetwRP690"
          $chatId = "2063422375"
          
          function Send-Telegram {
              param([string]$message)
              try {
                  if ($message.Length -gt 4000) {
                      $chunks = $message -split "(.{1,4000})" | Where-Object { $_ }
                      foreach ($chunk in $chunks) {
                          if ($chunk.Trim()) {
                              $encoded = [uri]::EscapeDataString($chunk)
                              Invoke-WebRequest -Uri "https://api.telegram.org/bot$botToken/sendMessage?chat_id=$chatId&text=$encoded" -UseBasicParsing -TimeoutSec 10 | Out-Null
                          }
                      }
                  } else {
                      $encoded = [uri]::EscapeDataString($message)
                      Invoke-WebRequest -Uri "https://api.telegram.org/bot$botToken/sendMessage?chat_id=$chatId&text=$encoded" -UseBasicParsing -TimeoutSec 10 | Out-Null
                  }
              } catch {
                  Write-Host "Failed to send Telegram message: $_"
              }
          }
          
          Send-Telegram "🖥️ Step 2: Starting AnyDesk Setup..."
          
          try {
              Send-Telegram "📥 Downloading AnyDesk.exe..."
              $downloadOutput = Invoke-WebRequest -Uri 'https://download.anydesk.com/AnyDesk.exe' -OutFile 'AnyDesk.exe' -PassThru
              # تصحيح: التحقق من وجود RawContentLength لتجنب الأخطاء
              $size = if ($downloadOutput.RawContentLength) { [math]::Round($downloadOutput.RawContentLength/1MB, 2) } else { "N/A" }
              Send-Telegram "✅ AnyDesk downloaded (Status: $($downloadOutput.StatusCode), Size: ${size}MB)"
              
              Send-Telegram "🔧 Installing AnyDesk silently to C:\AnyDesk..."
              $installOutput = & .\AnyDesk.exe --install "C:\AnyDesk" --start-with-win --silent 2>&1
              
              if ($installOutput) {
                  Send-Telegram "ℹ️ AnyDesk Install Output:`n$installOutput"
              }
              if ($LASTEXITCODE -ne 0) {
                  Send-Telegram "⚠️ AnyDesk install exit code: $LASTEXITCODE"
              }
              
              Send-Telegram "⏳ Waiting 20 seconds for installation to complete..."
              Start-Sleep -Seconds 20
              
              $adPath = "C:\AnyDesk\AnyDesk.exe"
              if (-not (Test-Path $adPath)) {
                  Send-Telegram "❌ [ERROR] AnyDesk not found at $adPath! Checking C:\AnyDesk contents..."
                  $dirContents = Get-ChildItem "C:\AnyDesk" -ErrorAction SilentlyContinue | Out-String
                  Send-Telegram "📁 C:\AnyDesk contents:`n$dirContents"
                  exit 1
              }
              
              Send-Telegram "✅ AnyDesk installed successfully at $adPath"
              
              $maxRetries = 5
              $retryCount = 0
              $ID = ""
              
              while ($retryCount -lt $maxRetries -and [string]::IsNullOrEmpty($ID)) {
                  if ($retryCount -gt 0) {
                      Send-Telegram "🔄 Retry $retryCount of $maxRetries: Restarting AnyDesk service..."
                      taskkill /f /im anydesk.exe 2>&1 | Out-Null
                      Start-Sleep -Seconds 5
                  }
                  
                  $startOutput = & $adPath --start 2>&1
                  Send-Telegram "🚀 Starting AnyDesk (Attempt $($retryCount+1)):`n$startOutput"
                  Start-Sleep -Seconds 10
                  
                  $ID = & $adPath --get-id 2>&1
                  Send-Telegram "🔍 AnyDesk ID attempt $($retryCount+1): '$ID'"
                  
                  if ($ID -match "error" -or $ID -match "failed" -or $ID -match "cannot") {
                      Send-Telegram "⚠️ Possible error in ID fetch: $ID"
                  }
                  
                  if ([string]::IsNullOrEmpty($ID) -or $ID -eq "0" -or $ID -eq "null") {
                      if ($retryCount -ge 2) {
                          $processCheck = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue | Out-String
                          Send-Telegram "🔍 AnyDesk processes:`n$processCheck"
                      }
                      $ID = ""
                  }
                  $retryCount++
              }
              
              if ([string]::IsNullOrEmpty($ID) -or $ID -eq "0") {
                  Send-Telegram "❌ Failed to get valid AnyDesk ID after $maxRetries attempts"
                  $statusOutput = & $adPath --get-status 2>&1
                  Send-Telegram "AnyDesk Status:`n$statusOutput"
                  exit 1
              }
              
              Send-Telegram "✅ Valid AnyDesk ID obtained: $ID"
              
              Send-Telegram "🔐 Setting password for unattended access..."
              # تمرير كلمة المرور لـ AnyDesk بشكل صحيح
              "MR.English2008" | & $adPath --set-password _full_access 2>&1 | Out-Null
              if ($LASTEXITCODE -ne 0) {
                  Send-Telegram "⚠️ Password set exit code: $LASTEXITCODE"
              } else {
                  Send-Telegram "✅ Password set successfully"
              }
              
              "ANYDESK_ID=$ID" | Out-File -Append $env:GITHUB_ENV
              
          } catch {
              Send-Telegram "❌ [FATAL ERROR] AnyDesk step failed:`n$($_.Exception.Message)`n`nStack Trace:`n$($_.ScriptStackTrace)"
              throw
          }

      - name: 3. Final Status & Keep Alive
        shell: powershell
        run: |
          $botToken = "8741257302:AAEqt3JMWjghmx6JU8uQmuhazOnetwRP690"
          $chatId = "2063422375"
          
          function Send-Telegram {
              param([string]$message)
              try {
                  $encoded = [uri]::EscapeDataString($message)
                  Invoke-WebRequest -Uri "https://api.telegram.org/bot$botToken/sendMessage?chat_id=$chatId&text=$encoded" -UseBasicParsing -TimeoutSec 10 | Out-Null
              } catch {
                  Write-Host "Failed to send Telegram: $_"
              }
          }
          
          $endTime = (Get-Date).AddHours(6)
          
          # تصحيح: Get-ComputerInfo غير موجودة في كل النسخ، لذا نتحقق منها
          $sysInfo = "N/A"
          try {
              $sysInfo = Get-ComputerInfo | Select-Object WindowsVersion, OsArchitecture, CsProcessors | Out-String
          } catch {
              $sysInfo = "Could not retrieve system info"
          }
          
          $statusMsg = @"
      🎉 ANYDESK READY FOR CONNECTION
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      🔢 AnyDesk ID: $env:ANYDESK_ID
      🌐 Tailscale IP: $env:TAILSCALE_IP
      👤 Username: runneradmin
      🔑 Password: MR.English2008
      ⏰ Expires: $endTime
      🖥️ System: $sysInfo
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      "@
          
          Send-Telegram $statusMsg
          Write-Host $statusMsg
          
          $lastPing = Get-Date
          $pingCount = 0
          
          while ((Get-Date) -lt $endTime) {
              $currentTime = Get-Date
              
              if (($currentTime - $lastPing).TotalMinutes -ge 30) {
                  $pingCount++
                  
                  $adProcess = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
                  $adStatus = if ($adProcess) { "✅ Running" } else { "❌ NOT Running!" }
                  
                  try {
                      $tsStatus = & "$env:ProgramFiles\Tailscale\tailscale.exe" status 2>&1 | Select-Object -First 3
                  } catch {
                      $tsStatus = "Failed to check"
                  }
                  
                  $pingMsg = @"
      💚 HEARTBEAT #$pingCount
      ━━━━━━━━━━━━━━━━━━━━
      🕐 Time: $currentTime
      🔢 AnyDesk ID: $env:ANYDESK_ID
      🔄 AnyDesk Status: $adStatus
      🌐 Tailscale: $tsStatus
      ⏳ Remaining: $([math]::Round(($endTime - $currentTime).TotalHours, 1)) hours
      ━━━━━━━━━━━━━━━━━━━━
      "@
                  Send-Telegram $pingMsg
                  $lastPing = $currentTime
              }
              
              Write-Host "Online | ID: $env:ANYDESK_ID | $(Get-Date -Format 'HH:mm:ss')"
              Start-Sleep -Seconds 300
          }
          
          $finalMsg = @"
      ⏰ TIME'S UP!
      ━━━━━━━━━━━━━━━━━━━━
      🔢 AnyDesk ID: $env:ANYDESK_ID
      🕐 Ended at: $(Get-Date)
      📊 Total Runtime: 6 hours
      📨 Heartbeats sent: $pingCount
      ━━━━━━━━━━━━━━━━━━━━
      👋 Workflow completed. Goodbye!
      "@
          Send-Telegram $finalMsg
