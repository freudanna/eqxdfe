name: AnyDesk Official CLI Setup

on:
  workflow_dispatch:

jobs:
  run-anydesk:
    runs-on: windows-latest
    steps:
      - name: 1. Install & Connect Tailscale
        shell: powershell
        run: |
          $botToken = "8741257302:AAEqt3JMWjghmx6JU8uQmuhazOnetwRP690"
          $chatId = "2063422375"
          function Send-Telegram {
            param([string]$m)
            try {
              $enc = [uri]::EscapeDataString($m)
              Invoke-WebRequest -Uri "https://api.telegram.org/bot$botToken/sendMessage?chat_id=$chatId&text=$enc" -UseBasicParsing -TimeoutSec 10 | Out-Null
            } catch {
              Write-Host "TG err: $_"
            }
          }
          Send-Telegram "Workflow Started - Run ID: ${{ github.run_id }}"

          try {
            Send-Telegram "Downloading Tailscale installer..."
            $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.92.3-amd64.msi"
            $installerPath = "$env:TEMP\tailscale.msi"
            Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

            Send-Telegram "Installing Tailscale silently..."
            Start-Process msiexec.exe -ArgumentList "/i `"$installerPath`" /quiet /norestart" -Wait

            Send-Telegram "Connecting Tailscale with auth key..."
            $authKey = '${{ secrets.TAILSCALE_AUTHKEY }}'
            $tsOutput = & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey="$authKey" --hostname="gh-runner-${{ github.run_id }}" 2>&1
            $safeOutput = $tsOutput -replace [regex]::Escape($authKey), "***"
            if ($safeOutput) { Send-Telegram "Tailscale UP Output: $safeOutput" }
            if ($tsOutput -match "login|authenticate|https://") {
              Send-Telegram "WARNING: Tailscale may be waiting for interactive login! $safeOutput"
            }

            Start-Sleep -Seconds 3
            $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>&1
            if ($tsIP -match "^\d+\.\d+\.\d+\.\d+$") {
              "TAILSCALE_IP=$tsIP" | Out-File -Append $env:GITHUB_ENV
              Send-Telegram "Tailscale Connected! IP: $tsIP"
            } else {
              Send-Telegram "Failed to get Tailscale IP: $tsIP"
              $tsStatus = & "$env:ProgramFiles\Tailscale\tailscale.exe" status 2>&1
              Send-Telegram "Tailscale Status: $tsStatus"
              throw "Tailscale connection failed"
            }
          } catch {
            Send-Telegram "Tailscale step failed: $($_.Exception.Message)"
            throw
          }

      - name: 2. Official AnyDesk Installation & Logic
        shell: cmd
        run: |
          echo [INFO] Downloading Official AnyDesk.exe...
          powershell -Command "Invoke-WebRequest -Uri 'https://download.anydesk.com/AnyDesk.exe' -OutFile 'AnyDesk.exe'"
          
          echo [INFO] Installing AnyDesk Silently...
          AnyDesk.exe --install "C:\AnyDesk" --start-with-win --silent
          
          echo [INFO] Waiting 20s for installation...
          powershell -Command "Start-Sleep -Seconds 20"
          
          set "adPath=C:\AnyDesk\AnyDesk.exe"

          if not exist "%adPath%" (
              echo [ERROR] AnyDesk was not found!
              exit 1
          )

          :START_ANYDESK
          echo [INFO] Starting AnyDesk service in background...
          start "" "%adPath%" --start
          powershell -Command "Start-Sleep -Seconds 10"

          echo [INFO] Attempting to fetch AnyDesk ID...
          for /f "delims=" %%i in ('"%adPath%" --get-id') do (
              set "ID=%%i"
          )

          if "%ID%"=="" (
              echo [WARNING] ID is empty, retrying...
              taskkill /f /im anydesk.exe > nul 2>&1
              goto START_ANYDESK
          )
          if "%ID%"=="0" (
              echo [WARNING] ID is 0, retrying...
              taskkill /f /im anydesk.exe > nul 2>&1
              goto START_ANYDESK
          )
          
          echo [SUCCESS] Valid ID found: %ID%
          echo [INFO] Setting password for Full Access...
          echo MR.English2008 | "%adPath%" --set-password _full_access
          
          echo ANYDESK_ID=%ID% >> %GITHUB_ENV%

      - name: 3. Final Status & Keep Alive (with Telegram)
        shell: powershell
        run: |
          $botToken = "8741257302:AAEqt3JMWjghmx6JU8uQmuhazOnetwRP690"
          $chatId = "2063422375"
          function Send-Telegram {
            param([string]$m)
            try {
              $enc = [uri]::EscapeDataString($m)
              Invoke-WebRequest -Uri "https://api.telegram.org/bot$botToken/sendMessage?chat_id=$chatId&text=$enc" -UseBasicParsing -TimeoutSec 10 | Out-Null
            } catch {
              Write-Host "TG err: $_"
            }
          }

          $endTime = (Get-Date).AddHours(6)
          $statusMsg = @"
          ANYDESK READY FOR CONNECTION
          ============================
          ID: $env:ANYDESK_ID
          Tailscale IP: $env:TAILSCALE_IP
          User: runneradmin
          Pass: MR.English2008
          Expires: $endTime
          ============================
          "@
          Send-Telegram $statusMsg
          Write-Host $statusMsg

          $lastPing = Get-Date
          $pingCount = 0
          while ((Get-Date) -lt $endTime) {
            $now = Get-Date
            if (($now - $lastPing).TotalMinutes -ge 30) {
              $pingCount++
              $ad = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
              $adStat = if ($ad) { "Running" } else { "NOT Running!" }
              try { $tsStat = & "$env:ProgramFiles\Tailscale\tailscale.exe" status 2>&1 | Select-Object -First 3 } catch { $tsStat = "Failed" }
              $pingMsg = @"
          Heartbeat #$pingCount
          Time: $now
          ID: $env:ANYDESK_ID
          AnyDesk: $adStat
          Tailscale: $tsStat
          Left: $([math]::Round(($endTime - $now).TotalHours,1))h
          "@
              Send-Telegram $pingMsg
              $lastPing = $now
            }
            Write-Host "Online | ID: $env:ANYDESK_ID | $(Get-Date -Format 'HH:mm:ss')"
            Start-Sleep -Seconds 300
          }
          Send-Telegram "Time's up! Workflow ending. ID: $env:ANYDESK_ID"
